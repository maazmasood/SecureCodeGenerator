<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure QR Code Generator with AES-256 encryption — generate, verify, and manage encrypted QR codes." />
  <title>{% block title %}SecureQR{% endblock %} — Encrypted QR Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <!-- ───── Navbar ───── -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="{{ url_for('index') }}" class="nav-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-text">Secure<span class="accent">QR</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Generator</a></li>
        <li><a href="{{ url_for('verify_page') }}" class="{% if request.endpoint == 'verify_page' %}active{% endif %}">Verify</a></li>
        <li><a href="{{ url_for('history') }}" class="{% if request.endpoint == 'history' %}active{% endif %}">History</a></li>
      </ul>
    </div>
  </nav>

  <!-- ───── Main ───── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ───── Footer ───── -->
  <footer class="footer">
    <div class="footer-container">
      <p>&copy; 2026 SecureQR &mdash; AES-256 Encrypted QR Code Generator</p>
      <p class="footer-sub">Built with Flask &amp; ❤️</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
